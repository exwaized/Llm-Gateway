name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: pip install -e ".[dev,api]"

      - name: Run tests
        run: pytest -q

      - name: Run benchmark (smoke check -- fails on error/non-zero exit)
        run: python examples/benchmark.py

      - name: Run resilience demo (smoke check -- fails on error/non-zero exit)
        run: python examples/run_demo.py
