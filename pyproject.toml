[project]
name = "llm-gateway"
version = "0.1.0"
description = "Cost-aware LLM inference router: complexity-based tiering, semantic caching, circuit breaking, graceful fallback."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.25"]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["llm_gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
